# Projeto Xcode gerado com XcodeGen (https://github.com/yonaskolb/XcodeGen).
# O arquivo MeuPontoDigital.xcodeproj já vem gerado; rode `xcodegen generate`
# apenas se alterar este arquivo ou adicionar/remover arquivos de código.
name: MeuPontoDigital
options:
  bundleIdPrefix: br.com.meupontodigital
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
packages:
  PontoCore:
    path: PontoCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  MeuPontoDigital:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PontoCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Meu Ponto Digital
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: "A câmera é usada para fotografar seus tickets de ponto. As fotos ficam somente neste iPhone."
        NSFaceIDUsageDescription: "O Face ID protege o acesso aos seus comprovantes de ponto."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: br.com.meupontodigital.backup
            UTTypeDescription: Backup do Meu Ponto Digital
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [mpdbackup]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.meupontodigital.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  MeuPontoDigitalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: MeuPontoDigital
      - package: PontoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.meupontodigital.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MeuPontoDigital.app/MeuPontoDigital
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  MeuPontoDigital:
    build:
      targets:
        MeuPontoDigital: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MeuPontoDigitalTests
        - package: PontoCore/PontoCoreTests
    archive:
      config: Release
