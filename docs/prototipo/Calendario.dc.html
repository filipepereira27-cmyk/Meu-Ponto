<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Calendário</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#136CA3}a:hover{color:#0d4f78}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F2F7; font-family: -apple-system, system-ui, 'Helvetica Neue', Arial, sans-serif; color: #1c1c1e; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 20px 16px 0 16px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
<h1 style="margin: 0; font-size: 30px; font-weight: 700">Calendário</h1>
<div style="display: flex; justify-content: space-between; align-items: center">
<button aria-label="Mês anterior" style="width: 44px; height: 44px; border: none; background: transparent; color: #136CA3; font-size: 22px">‹</button>
<span style="font-size: 22px; font-weight: 700">Outubro de 2026</span>
<button aria-label="Próximo mês" style="width: 44px; height: 44px; border: none; background: transparent; color: #136CA3; font-size: 22px">›</button>
</div>
<div style="background: #fff; border-radius: 16px; padding: 12px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
<div style="text-align: center; font-size: 12px; font-weight: 600; color: #5c5c61">{{w}}</div>
</sc-for>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<div style="{{c.style}}">
<span style="{{c.numStyle}}">{{c.label}}</span>
<sc-if value="{{c.has}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; font-weight: 700; color: #fff; background: #136CA3; border-radius: 8px; padding: 0 6px">{{c.count}}</span>
</sc-if>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 16px; font-size: 12px; color: #5c5c61"><span><span style="color: #136CA3">●</span> Com tickets</span><span><span style="color: #c66a00">!</span> Precisa de revisão</span></div>
<div style="background: #fff; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 17px; font-weight: 600">Dias com tickets em outubro de 2026</div>
<div style="display: flex; gap: 12px; font-size: 14px"><span style="width: 96px; font-weight: 600">22/10/2026</span><span style="font-family: Menlo, monospace">08:01  12:00  13:02  17:32</span></div>
<div style="display: flex; gap: 12px; font-size: 14px"><span style="width: 96px; font-weight: 600">21/10/2026</span><span style="font-family: Menlo, monospace">07:58  12:01  13:00  17:30</span></div>
</div>
</div>
<nav style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 0 22px 0; background: rgba(249,249,249,0.96); border-top: 1px solid #d8d8dc; font-size: 10px; text-align: center; color: #6b6b70">
<span>Início</span><span>Arquivo</span><span style="color: #136CA3; font-weight: 600">Calendário</span><span>Jornada</span><span>Ajustes</span>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var counts = {1: 4, 2: 4, 5: 4, 6: 4, 7: 3, 8: 4, 9: 4, 13: 4, 14: 4, 15: 4, 16: 4, 19: 4, 20: 4, 21: 4, 22: 4};
var cells = [];
for (var b = 0; b < 4; b++) {
cells.push({ label: '', has: false, count: 0, style: 'height: 46px', numStyle: '' });
}
for (var d = 1; d <= 31; d++) {
var n = counts[d] || 0;
var today = d === 22;
cells.push({
label: String(d),
has: n > 0,
count: n,
style: 'height: 46px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; '
+ (n > 0 ? 'background: #e8f1f8; ' : '')
+ (today ? 'outline: 1.5px solid #136CA3; ' : ''),
numStyle: 'font-size: 15px; ' + (today ? 'font-weight: 700; color: #136CA3' : '')
});
}
return {
weekdays: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'],
cells: cells
};
}
}
</script>
</body>
</html>
